apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-deployment
spec:
  template:
    spec:
      volumes:
        - name: healthcheck-data
          persistentVolumeClaim:
            claimName: healthcheck-data2-uat
      containers:
        - name: healthcheck
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: healthcheck-env-uat
                optional: false
          volumeMounts:
            - mountPath: /app/data_dir
              name: healthcheck-data
